<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Legendary Treasure</title>
  <style>
    :root { --ink:#17252a; --cream:#f6f0df; --forest:#356859; --moss:#9dbebb; --gold:#e4ad3a; --red:#b8463f; --night:#263848; }
    * { box-sizing:border-box; }
    body { align-items:center; background:linear-gradient(135deg, #e6d7b6, #a8c5b7); color:var(--ink); display:flex; font-family:Georgia, serif; justify-content:center; margin:0; min-height:100vh; padding:24px; }
    main { background:var(--cream); border:5px solid var(--ink); box-shadow:12px 12px 0 rgba(23,37,42,.28); max-width:760px; overflow:hidden; padding:clamp(26px,6vw,56px); width:100%; }
    .eyebrow { color:var(--forest); font:700 12px Arial,sans-serif; letter-spacing:1.5px; text-transform:uppercase; }
    h1 { font-size:clamp(38px,8vw,70px); line-height:.93; margin:12px 0 18px; }
    .scene { background:var(--night); border:3px solid var(--ink); height:220px; margin:0 0 28px; overflow:hidden; position:relative; }
    .scene svg { display:block; height:100%; width:100%; }
    .scene-title { bottom:12px; color:#fff7dc; font:700 12px Arial,sans-serif; letter-spacing:1.2px; position:absolute; right:14px; text-transform:uppercase; }
    .moon { animation:glow 2.8s ease-in-out infinite alternate; transform-origin:center; }
    .fire { animation:flicker .85s ease-in-out infinite alternate; transform-origin:50% 86%; }
    .spark { animation:rise 2.4s ease-in infinite; }
    .spark-two { animation-delay:.7s; }
    .treasure, .forest-art, .cave-art, .bridge-art { opacity:0; transition:opacity .35s; }
    .scene.forest .forest-art, .scene.cave .cave-art, .scene.river .bridge-art { opacity:1; }
    .scene.win .treasure { animation:treasure-pop .7s ease-out forwards; opacity:1; }
    .scene.loss { filter:grayscale(.7) brightness(.72); }
    #story { font-size:20px; line-height:1.55; margin:0 0 28px; }
    label { display:block; font-family:Arial,sans-serif; font-size:13px; font-weight:700; margin-bottom:8px; text-transform:uppercase; }
    input { background:#fffdf7; border:2px solid var(--ink); font:18px Georgia,serif; padding:12px; width:100%; }
    .choices { display:grid; gap:12px; margin-top:22px; }
    button { background:var(--forest); border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); color:white; cursor:pointer; font:700 16px Arial,sans-serif; padding:14px 16px; text-align:left; }
    button:hover, button:focus { background:#244b40; transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
    .hidden { display:none; }
    .result { border-left:8px solid var(--gold); padding:12px 16px; background:#fff8df; }
    .loss { border-left-color:var(--red); background:#fde9df; }
    @keyframes glow { to { filter:brightness(1.35); } }
    @keyframes flicker { to { transform:scale(.88,1.12); } }
    @keyframes rise { from { opacity:0; transform:translateY(15px); } 35% { opacity:1; } to { opacity:0; transform:translateY(-45px); } }
    @keyframes treasure-pop { from { opacity:0; transform:scale(.35); } to { opacity:1; transform:scale(1); } }
    @media (max-width:720px) { .scene { height:180px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Interactive Python Adventure</div>
    <h1>The Legendary Treasure</h1>
    <div id="scene" class="scene" aria-label="Adventure scene">
      <div id="scene-title" class="scene-title">The ancient land</div>
      <svg viewBox="0 0 700 220" role="img" aria-label="An illustrated ancient land at night">
        <rect width="700" height="220" fill="#263848"/>
        <circle class="moon" cx="580" cy="48" r="29" fill="#fff1b8"/>
        <path d="M0 140 L100 76 L190 146 L285 70 L395 145 L510 83 L700 150 V220 H0Z" fill="#315560"/>
        <path d="M0 164 Q140 132 285 166 T700 154 V220 H0Z" fill="#23463e"/>
        <g class="forest-art"><path d="M80 45 V184 M42 111 L80 45 L116 111 M35 149 L80 76 L125 149" stroke="#132f2b" stroke-width="18" fill="none"/><path d="M630 63 V189 M592 128 L630 63 L670 128 M584 166 L630 91 L680 166" stroke="#132f2b" stroke-width="20" fill="none"/><path d="M0 185 Q100 150 210 182 T420 178 T700 180" fill="none" stroke="#78b6a5" stroke-width="10"/></g>
        <g class="bridge-art"><path d="M170 165 Q350 85 535 163" fill="none" stroke="#b99162" stroke-width="16"/><path d="M170 165 Q350 116 535 163" fill="none" stroke="#6f4b34" stroke-width="5" stroke-dasharray="11 8"/></g>
        <g class="cave-art"><path d="M120 220 Q145 48 350 34 Q555 48 590 220Z" fill="#18272e"/><path d="M177 220 Q196 84 350 68 Q504 84 524 220Z" fill="#344851"/><g class="fire"><path d="M345 185 C322 160 350 128 350 111 C380 147 381 168 355 185Z" fill="#f6bd48"/><path d="M351 184 C341 168 356 151 354 140 C371 164 368 178 356 185Z" fill="#e0693c"/></g><circle class="spark" cx="375" cy="145" r="3" fill="#ffd76a"/><circle class="spark spark-two" cx="329" cy="154" r="2" fill="#ffd76a"/></g>
        <g class="treasure"><rect x="290" y="144" width="120" height="54" rx="4" fill="#9b5e2f" stroke="#ffe08b" stroke-width="5"/><path d="M290 165 H410" stroke="#ffe08b" stroke-width="6"/><circle cx="350" cy="171" r="8" fill="#ffe08b"/></g>
      </svg>
    </div>
    <div id="name-area">
      <label for="player-name">Explorer name</label>
      <input id="player-name" type="text" placeholder="Enter your name" maxlength="30">
    </div>
    <p id="story">An ancient land guards a legendary treasure. Choose your route carefully.</p>
    <div id="choices" class="choices"></div>
  </main>
  <script>
    const story = document.getElementById('story');
    const choices = document.getElementById('choices');
    const nameArea = document.getElementById('name-area');
    const nameInput = document.getElementById('player-name');
    const scene = document.getElementById('scene');
    const sceneTitle = document.getElementById('scene-title');
    let player = 'Explorer';

    function setChoices(options) {
      choices.innerHTML = '';
      options.forEach(([label, action]) => {
        const button = document.createElement('button');
        button.textContent = label;
        button.addEventListener('click', action);
        choices.appendChild(button);
      });
    }

    function begin() {
      player = nameInput.value.trim() || 'Explorer';
      nameArea.classList.add('hidden');
      story.textContent = `Welcome, ${player}. Choose your path to the treasure.`;
      setScene('', 'Choose your route');
      setChoices([['Enter the dark forest', forest], ['Explore the mysterious cave', cave]]);
    }

    function forest() {
      story.textContent = 'You enter the dense forest. A river blocks the path ahead.';
      setScene('forest', 'The dark forest');
      setChoices([['Follow the river', river], ['Climb a tree', () => lose('You disturb a nest of hornets and retreat without the treasure.')]]);
    }

    function river() {
      story.textContent = 'The river leads to an ancient stone bridge.';
      setScene('river', 'The ancient bridge');
      setChoices([['Cross the bridge', () => lose('The bridge collapses. You escape, but the treasure is lost.')], ['Search beneath the bridge', () => win('You find a hidden chest containing the legendary treasure!')]]);
    }

    function cave() {
      story.textContent = 'You enter the mysterious cave. The passage becomes completely dark.';
      setScene('cave', 'The hidden cave');
      setChoices([['Light a torch', torch], ['Proceed in the dark', () => lose('You lose your way in the darkness and return empty-handed.')]]);
    }

    function torch() {
      story.textContent = 'The torch reveals symbols pointing toward a sealed stone door.';
      setScene('cave', 'Torchlit symbols');
      setChoices([['Read the symbols', () => win('The symbols unlock the door. Inside is the legendary treasure!')], ['Force the door', () => lose('The cave shakes and blocks the exit. Your expedition ends.')]]);
    }

    function win(message) {
      story.className = 'result';
      setScene('win', 'Treasure discovered');
      story.textContent = `${message} Congratulations, ${player}! You completed the quest.`;
      setChoices([['Play again', reset]]);
    }

    function lose(message) {
      story.className = 'result loss';
      setScene('loss', 'Quest paused');
      story.textContent = `${message} The adventure is over for now.`;
      setChoices([['Restart adventure', reset], ['End game', endGame]]);
    }

    function reset() {
      story.className = '';
      setScene('', 'The ancient land');
      nameArea.classList.remove('hidden');
      nameInput.value = '';
      story.textContent = 'An ancient land guards a legendary treasure. Choose your route carefully.';
      setChoices([['Begin adventure', begin]]);
    }

    function endGame() {
      story.className = '';
      story.textContent = `Thank you for playing, ${player}. Farewell, explorer!`;
      choices.innerHTML = '';
    }

    function setScene(state, title) {
      scene.className = `scene ${state}`;
      sceneTitle.textContent = title;
    }

    setChoices([['Begin adventure', begin]]);
  </script>
</body>
</html>
